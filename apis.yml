  detail: >-
    The FCSC is a quasi-judicial claims tribunal that runs no host of its own — its entire public
    surface is a section of www.justice.gov, and contract discovery on 2026-09-10 turned up only HTML
    pages and PDF decisions: /openapi.json, /swagger.json, /jsonapi and every named /.well-known/ path
    404'd on www.justice.gov (a negative-control path 404'd too, so the host is not a catch-all), and
    the parent department's DOJ News API ignores a component=fcsc filter, returning the unfiltered
    department-wide feed byte-for-byte.
