aid: foreign-claims-settlement-commission
name: Foreign Claims Settlement Commission
description: >-
  The Foreign Claims Settlement Commission of the United States (FCSC) is a quasi-judicial,
  independent agency within the U.S. Department of Justice that adjudicates claims of U.S. nationals
  against foreign governments, under the International Claims Settlement Act (22 U.S.C. 1621 et seq.)
  and the War Claims Act (50 U.S.C. 4101-4147). Established in 1954 from the War Claims Commission and
  the International Claims Commission, it has run 43 completed country programs — Germany, Iran,
  Yugoslavia, Hungary, the Soviet Union, Poland, Italy, Cuba, China, Vietnam, Egypt, Panama and
  Albania among them — adjudicating more than 660,000 claims with awards in the billions of dollars.
  The Albania program remains open and the Commission serves as Special Master in Helms-Burton claims
  against Cuba. It publishes Final Opinions and Orders and annual reports on www.justice.gov, and
  operates no API or developer program of its own.
